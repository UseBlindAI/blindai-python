name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}' }
      - run: pip install -e ".[dev]"
      - run: pytest tests -p no:cacheprovider --ignore=tests/contract
      - run: ruff check blindai tests
      - run: mypy

  # Invariant 1 of 2. Static: the client may produce an allow-shaped value in exactly one place,
  # the response parser. Catches a fabricated allow, including a dataclass field default or a
  # parameter default -- the two idiomatic ways to write one in Python.
  no-local-verdicts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python scripts/no_local_verdicts.py blindai --parser parse.py

  # Invariant 2 of 2. Behavioural: every public call either makes exactly one request or raises,
  # and the decision returned was built from the body served for THAT request. Catches the two
  # things the static check cannot see -- a call that never asked, and a reused answer.
  every-call-asks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_every_call_asks.py -p no:cacheprovider

  contract:
    runs-on: ubuntu-latest
    needs: [test, no-local-verdicts, every-call-asks]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      BLINDAI_BASE_URL: ${{ secrets.BLINDAI_CONTRACT_BASE_URL }}
      BLINDAI_API_KEY: ${{ secrets.BLINDAI_CONTRACT_API_KEY }}
    steps:
      # Optional until switch-on (Elisha's ruling, 2026-10-06, option b): with no key, or a value
      # that is not a BlindAI API key (ba_...), the job says so and skips, instead of failing every
      # PR on a secret nobody can fix before switch-on. At switch-on a proper key and
      # BLINDAI_RUNTIME_SECRET are set and this job is required again. The value is never printed.
      - id: key
        run: |
          if [ -n "$BLINDAI_BASE_URL" ] && [ "${BLINDAI_API_KEY#ba_}" != "$BLINDAI_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=contract tests skipped::BLINDAI_CONTRACT_API_KEY is absent or not a ba_ API key (optional until switch-on, 2026-10-06)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.key.outputs.ready == 'true'
        with: { python-version: '3.11' }
      - run: pip install -e ".[dev]"
        if: steps.key.outputs.ready == 'true'
      - run: pytest tests/contract -p no:cacheprovider
        if: steps.key.outputs.ready == 'true'
