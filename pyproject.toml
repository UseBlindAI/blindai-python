[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blindai-sdk"
version = "0.1.0"
description = "Fail-closed Python client for the BlindAI authorization API"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "BlindAI" }]
keywords = ["ai", "security", "llm", "prompt-injection", "agents", "authorization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]

# One runtime dependency. pydantic was dropped with the rest of the fat client: a wire client that
# parses one response shape does not need a validation framework, and every dependency in a
# security client is a dependency a customer has to audit.
dependencies = ["httpx>=0.24.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.21", "mypy>=1.8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/UseBlindAI/blindai-python"
Issues = "https://github.com/UseBlindAI/blindai-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["blindai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
# No python_version: current mypy refuses 3.9 as a target. The package supports 3.9 via
# `from __future__ import annotations`; CI runs the test suite on 3.9 itself, which is the check
# that matters.
strict = true
files = ["blindai"]
