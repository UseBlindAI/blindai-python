[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blindai-sdk"
version = "0.1.0"
description = "Security guardrails for AI agents - protect against prompt injection, data leakage, and unauthorized actions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "BlindAI Team", email = "support@useblindai.com" }
]
keywords = [
    "ai-security",
    "llm",
    "guardrails",
    "prompt-injection",
    "ai-agents",
    "security",
    "pii-detection"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
langchain = ["langchain>=0.1.0"]
llamaindex = ["llama-index>=0.10.0"]
crewai = ["crewai>=0.1.0"]
openai = ["openai>=1.0.0"]
all = [
    "langchain>=0.1.0",
    "llama-index>=0.10.0",
    "crewai>=0.1.0",
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "respx>=0.20.0",
]

[project.urls]
Homepage = "https://useblindai.com"
Documentation = "https://docs.useblindai.com"
Repository = "https://github.com/useblindai/blindai-python"
Changelog = "https://github.com/useblindai/blindai-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/useblindai/blindai-python/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blindai = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
